[project]
name = "nfa-fire-law-rag"
version = "0.2.0"
description = "Taiwan NFA fire prevention/investigation law crawler + SQLite/FTS5/NumPy RAG + optional PostgreSQL/pgvector + FastAPI + MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.2,<2",
  "numpy>=1.26,<3",
  "openai>=1.50,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]
postgres = ["pgvector>=0.3,<1", "psycopg[binary]>=3.2,<4"]

[project.scripts]
nfa-law = "app.cli:app"
nfa-law-mcp = "app.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
