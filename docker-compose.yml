services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nfa
      POSTGRES_PASSWORD: nfa
      POSTGRES_DB: nfa_law
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfa -d nfa_law"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.cli init-db && uvicorn app.api:app --host 0.0.0.0 --port 8000"]

volumes:
  pgdata:
